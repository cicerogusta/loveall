# API gratuita para homologação. Banco/fotos ficam fora do disco efêmero.
services:
  - type: web
    name: loveall-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: PHOTO_STORAGE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PHOTO_BUCKET
        value: loveall-photos
      - key: PLAY_BILLING_ENABLED
        value: "false"
      - key: ADMOB_PUBLISHER_ID
        value: pub-7902597376494373
