# Deploy no Render.com
# 1. Conecte seu repo GitHub
# 2. O Render detecta automaticamente este arquivo
services:
  - type: web
    name: loveall
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: loveall-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
