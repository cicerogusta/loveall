name: Android nativo

on:
  pull_request:
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android-native.yml']
  push:
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', '.github/workflows/android-native.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Instalar SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Build, testes, lint e cobertura
        run: bash gradlew :app:assembleDebug :app:lintDebug :app:lintRelease :app:verifyBusinessCoverage :app:assembleDebugAndroidTest :app:bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-results
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/
