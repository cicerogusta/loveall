# Deploy no Fly.io
# flyctl launch --no-deploy
# flyctl secrets set JWT_SECRET=$(openssl rand -hex 32)
# flyctl deploy

app = "loveall"
primary_region = "gru"  # Sao Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "loveall_data"
  destination = "/app/server/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
