[versions]
agp = "8.13.2"
kotlin = "2.3.0"
compose = "2025.09.01"
activity = "1.11.0"
lifecycle = "2.9.4"
coroutines = "1.10.2"
retrofit = "2.11.0"
okhttp = "4.12.0"
junit = "4.13.2"
androidxTest = "1.3.0"
runner = "1.7.0"
navigation = "2.9.5"
coil = "2.7.0"
icons = "1.7.8"
espresso = "3.7.0"
exifinterface = "1.4.2"
playBilling = "9.1.0"
mobileAds = "1.6.0"
ump = "4.0.0"

[libraries]
play-billing = { module = "com.android.billingclient:billing", version.ref = "playBilling" }
mobile-ads = { module = "com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk", version.ref = "mobileAds" }
ump = { module = "com.google.android.ump:user-messaging-platform", version.ref = "ump" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test = { module = "androidx.test.ext:junit", version.ref = "androidxTest" }
androidx-runner = { module = "androidx.test:runner", version.ref = "runner" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
compose-icons = { module = "androidx.compose.material:material-icons-core", version.ref = "icons" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
