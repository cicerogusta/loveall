services:
  - type: web
    name: loveall-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://loveall.vercel.app
      - key: DB_PATH
        value: /var/data/loveall.db
      - key: CORS_ORIGINS
        value: https://loveall.vercel.app,http://localhost:5173
